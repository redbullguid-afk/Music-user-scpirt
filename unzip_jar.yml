name: Auto Unzip JAR Files

on:
  push:
    paths:
      - '*.jar'

jobs:
  unzip-jar-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Unzip all JAR files into folders
        run: |
          for f in *.jar; do
            if [ -f "$f" ]; then
              echo "Đang giải nén tệp $f..."
              folder_name="${f%.jar}"
              mkdir -p "$folder_name"
              unzip -o "$f" -d "$folder_name"
              rm "$f"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Tự động giải nén tệp .jar thành thư mục" || exit 0
          git push origin ${{ github.ref_name }}
